apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/gke-production/apps
  prune: true
  wait: true # <--- Forces Flux to wait for resources to become healthy
  timeout: 2m # <--- Fails if pods don't stabilize within 2 minutes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
---
